services:

  web-site:
    image: docker/dev-environments-cutie-web-site:stable-1
    init: true
    volumes:
      - ../site/project/httpd-vhosts.conf:/etc/apache2/sites-available/000-default.conf:ro
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - ..:/app
    build: ../site/project
    extra_hosts:
      - "ujnotes.local:127.0.0.1"
      - "local.cutie.codes:127.0.0.1"
      - "interim.cutie.codes:127.0.0.1"
      - "public.cutie.codes:127.0.0.1"
    #restart: always
    networks:
      dan:
        ipv4_address: 10.10.0.2

  nginx-proxy:
    image: nginx:latest
    init: true
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf:/etc/nginx/conf:ro
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - ..:/app
    build: ./nginx
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    depends_on:
      - web-site
    #restart: always
    networks:
      - dan
      
networks:
  dan:
    driver: bridge
    ipam:
     config:
       - subnet: 10.10.0.0/24
