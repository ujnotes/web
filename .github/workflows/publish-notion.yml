name: Publish article from Notion

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Optional exact Notion article slug
        required: false
        type: string
      dry_run:
        description: Build and validate without pushing or updating Notion
        required: true
        default: true
        type: boolean
      rerender_published:
        description: Re-render an explicitly requested slug whose Notion status is published
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: notion-article-publisher-prod
  cancel-in-progress: false

jobs:
  publish:
    name: Render, deploy, and verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: prod
    env:
      BASE_URL: https://ujnotes.com
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
      PUBLISH_TOKEN: ${{ secrets.UJNOTES_PUBLISH_TOKEN }}
      BUNDLE_DIR: ${{ github.workspace }}/.ncms-publish/bundle
      METADATA_FILE: ${{ github.workspace }}/.ncms-publish/article.json
      STAGE_DIR: ${{ github.workspace }}/.ncms-publish/site
      SITE_PROJECT_DIR: ${{ github.workspace }}/.ncms-publish/site

    steps:
      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NOTION_API_KEY" || { echo "NOTION_API_KEY is missing" >&2; exit 1; }
          test -n "$NOTION_DATABASE_ID" || { echo "prod variable NOTION_DATABASE_ID is missing" >&2; exit 1; }
          test -n "$PUBLISH_TOKEN" || { echo "UJNOTES_PUBLISH_TOKEN is missing" >&2; exit 1; }

      - name: Check out workflow repository
        uses: actions/checkout@v7
        with:
          path: project

      - name: Check out site source
        uses: actions/checkout@v7
        with:
          repository: ujnotes/web-site
          token: ${{ secrets.UJNOTES_PUBLISH_TOKEN }}
          submodules: recursive
          path: site/project

      - name: Check out public deployment repository
        uses: actions/checkout@v7
        with:
          repository: ujnotes/web-public
          token: ${{ secrets.UJNOTES_PUBLISH_TOKEN }}
          path: project/build

      - name: Check out Tiggu renderer
        uses: actions/checkout@v7
        with:
          repository: blank-org/tiggu
          ref: 46f3400883e95187c9c1eef69e9f00612a9b9601
          path: tiggu

      - name: Check out NCMS
        uses: actions/checkout@v7
        with:
          repository: blank-org/ncms
          path: ncms

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ncms/requirements.txt

      - name: Install NCMS
        run: python -m pip install --requirement ncms/requirements.txt

      - name: Render queued article with NCMS
        id: render
        shell: bash
        env:
          REQUESTED_SLUG: ${{ github.event_name == 'workflow_dispatch' && inputs.slug || '' }}
          REQUESTED_STATUS: ${{ github.event_name == 'workflow_dispatch' && inputs.rerender_published && 'published' || 'publish' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          set -euo pipefail
          if [[ "$REQUESTED_STATUS" == "published" && -z "$REQUESTED_SLUG" ]]; then
            echo "rerender_published requires an explicit slug" >&2
            exit 1
          fi
          mkdir -p "$BUNDLE_DIR"
          args=(
            publish
            --status "$REQUESTED_STATUS"
            --bundle-dir "$BUNDLE_DIR"
            --metadata-file "$METADATA_FILE"
          )
          if [[ -n "$REQUESTED_SLUG" ]]; then
            args+=(--slug "$REQUESTED_SLUG")
          fi
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            args+=(--allow-empty)
          fi
          python ncms/ncms_fetch.py "${args[@]}"

          has_work=$(python -c 'import json,sys; print(str(not json.load(open(sys.argv[1], encoding="utf-8")).get("no_work", False)).lower())' "$METADATA_FILE")
          publish_changes=true
          if [[ "$DRY_RUN" == "true" ]]; then
            publish_changes=false
          fi
          echo "has_work=$has_work" >> "$GITHUB_OUTPUT"
          echo "publish_changes=$publish_changes" >> "$GITHUB_OUTPUT"

      - name: Prepare source and isolated build
        if: steps.render.outputs.has_work == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python project/ci/publish_notion.py prepare-source \
            --bundle "$BUNDLE_DIR" \
            --metadata "$METADATA_FILE" \
            --source site/project \
            --base-url "$BASE_URL"
          python project/ci/publish_notion.py create-stage \
            --metadata "$METADATA_FILE" \
            --source site/project \
            --stage "$STAGE_DIR"

          if [[ ! -e site/project/root ]]; then
            ln -s Root site/project/root
          fi
          if [[ ! -e "$STAGE_DIR/root" ]]; then
            ln -s Root "$STAGE_DIR/root"
          fi

      - name: Start Cutie renderer
        if: steps.render.outputs.has_work == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f project/compose-dev.yaml -p ujnotes-actions up -d --build web-site
          docker compose -f project/compose-dev.yaml -p ujnotes-actions exec -T web-site sh -lc '
            set -eu
            apt-get update
            apt-get install -y --no-install-recommends default-jre-headless minify wget
            rm -rf /var/lib/apt/lists/*
            mkdir -p /usr/local/lib/gclosure
            if [ ! -s /usr/local/lib/gclosure/closure-compiler.jar ]; then
              wget -q -O /usr/local/lib/gclosure/closure-compiler.jar \
                https://repo1.maven.org/maven2/com/google/javascript/closure-compiler/v20240317/closure-compiler-v20240317.jar
            fi
          '

      - name: Validate PHP and render article
        if: steps.render.outputs.has_work == 'true'
        shell: bash
        run: |
          set -euo pipefail
          component=$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["source_component"])' "$METADATA_FILE")
          docker compose -f project/compose-dev.yaml -p ujnotes-actions exec -T web-site \
            php -l "/app/site/project/$component"
          docker compose -f project/compose-dev.yaml -p ujnotes-actions exec -T web-site \
            /app/tiggu/build.sh /app/.ncms-publish/site

      - name: Validate and prepare public artifacts
        if: steps.render.outputs.has_work == 'true'
        run: |
          python project/ci/publish_notion.py publish-artifacts \
            --metadata "$METADATA_FILE" \
            --stage "$STAGE_DIR" \
            --public-repo project/build \
            --base-url "$BASE_URL"
          python -m json.tool project/build/firebase.json >/dev/null
          python -c 'import xml.etree.ElementTree as ET; ET.parse("project/build/public/sitemap.xml")'
          git -C site/project diff --check
          git -C project/build diff --check

      - name: Upload dry-run artifacts
        if: steps.render.outputs.has_work == 'true' && steps.render.outputs.publish_changes != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: notion-article-dry-run
          path: |
            ${{ env.METADATA_FILE }}
            ${{ env.STAGE_DIR }}/public
          if-no-files-found: error
          retention-days: 7

      - name: Commit and push source
        if: steps.render.outputs.has_work == 'true' && steps.render.outputs.publish_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git -C site/project config user.name "ujnotes-publisher[bot]"
          git -C site/project config user.email "ujnotes-publisher[bot]@users.noreply.github.com"
          while IFS= read -r path; do
            git -C site/project add -- "$path"
          done < <(python -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); print("\n".join(d[key] for key in ("source_component", "source_id", "source_url", "source_sitemap")))' "$METADATA_FILE")
          git -C site/project diff --cached --check
          if ! git -C site/project diff --cached --quiet; then
            slug=$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["slug"])' "$METADATA_FILE")
            git -C site/project commit -m "Publish $slug from Notion"
            git -C site/project push origin HEAD:main
          fi

      - name: Commit and push public site
        if: steps.render.outputs.has_work == 'true' && steps.render.outputs.publish_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git -C project/build config user.name "ujnotes-publisher[bot]"
          git -C project/build config user.email "ujnotes-publisher[bot]@users.noreply.github.com"
          while IFS= read -r path; do
            git -C project/build add -- "$path"
          done < <(python -c 'import json,sys; print("\n".join(json.load(open(sys.argv[1], encoding="utf-8"))["public_paths"]))' "$METADATA_FILE")
          git -C project/build diff --cached --check
          if ! git -C project/build diff --cached --quiet; then
            slug=$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["slug"])' "$METADATA_FILE")
            git -C project/build commit -m "Publish $slug from Notion"
            git -C project/build push origin HEAD:main
          fi

      - name: Verify live deployment
        if: steps.render.outputs.has_work == 'true' && steps.render.outputs.publish_changes == 'true'
        run: |
          python project/ci/publish_notion.py verify-live \
            --metadata "$METADATA_FILE" \
            --base-url "$BASE_URL" \
            --timeout 600

      - name: Mark Notion page published
        if: steps.render.outputs.has_work == 'true' && steps.render.outputs.publish_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          page_id=$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["page_id"])' "$METADATA_FILE")
          slug=$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["slug"])' "$METADATA_FILE")
          python ncms/ncms_fetch.py mark-published --page-id "$page_id" --expected-slug "$slug"

      - name: Stop renderer
        if: always() && steps.render.outputs.has_work == 'true'
        run: docker compose -f project/compose-dev.yaml -p ujnotes-actions down --remove-orphans
