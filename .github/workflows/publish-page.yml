# Guarded publisher for ujnotes.com.
# Current trigger: workflow_dispatch (manual) plus local publish-notion*.ps1
# pushes to ujnotes/web-public. Firebase Hosting deploys on that push.
# Notion cron polling is parked. Planned replacement: URL hook / dashboard
# trigger (repository_dispatch). Do not restore the 15-minute schedule.
name: Publish page from Source

on:
  workflow_dispatch:
    inputs:
      source:
        description: Article content source
        required: true
        default: notion
        type: choice
        options:
          - notion
          - github
      slug:
        description: Optional article slug (* for all; hi/<slug> for one language)
        required: false
        type: string
      dry_run:
        description: Render and validate without publishing changes
        required: false
        default: false
        type: boolean
      rerender_published:
        description: Re-render an already-published Notion article
        required: false
        default: false
        type: boolean
  # Parked: 15-minute Notion queue poll. Replaced later by a URL hook /
  # dashboard trigger. Production currently depends on a manual push.
  # schedule:
  #   - cron: "*/15 * * * *"
  # Planned, not enabled:
  # repository_dispatch:
  #   types: [publish-page]

permissions:
  contents: read

concurrency:
  group: notion-article-publisher-prod
  cancel-in-progress: false

jobs:
  publish:
    name: Render, deploy, and verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: prod
    env:
      BASE_URL: https://ujnotes.com
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
      PUBLISH_TOKEN: ${{ secrets.UJNOTES_PUBLISH_TOKEN }}
      BUNDLE_DIR: ${{ github.workspace }}/.ncms-publish/bundle
      METADATA_FILE: ${{ github.workspace }}/.ncms-publish/article.json
      STAGE_DIR: ${{ github.workspace }}/.ncms-publish/site
      SITE_PROJECT_DIR: ${{ github.workspace }}/.ncms-publish/site
      CONTENT_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.source || 'notion' }}

    steps:
      - name: Validate production configuration
        shell: bash
        env:
          REQUESTED_SLUG: ${{ github.event_name == 'workflow_dispatch' && inputs.slug || '' }}
        run: |
          set -euo pipefail
          test -n "$PUBLISH_TOKEN" || { echo "UJNOTES_PUBLISH_TOKEN is missing" >&2; exit 1; }
          if [[ "$CONTENT_SOURCE" != "notion" && "$CONTENT_SOURCE" != "github" ]]; then
            echo "source must be notion or github (got $CONTENT_SOURCE)" >&2
            exit 1
          fi
          # * means render every published article from the GitHub site tree.
          if [[ "${REQUESTED_SLUG:-}" == "*" ]]; then
            echo "CONTENT_SOURCE=github" >> "$GITHUB_ENV"
            CONTENT_SOURCE=github
          fi
          if [[ "$CONTENT_SOURCE" != "github" ]]; then
            test -n "$NOTION_API_KEY" || { echo "NOTION_API_KEY is missing" >&2; exit 1; }
            test -n "$NOTION_DATABASE_ID" || { echo "prod variable NOTION_DATABASE_ID is missing" >&2; exit 1; }
          fi

      - name: Check out workflow repository
        uses: actions/checkout@v7
        with:
          path: project

      - name: Check out site source
        uses: actions/checkout@v7
        with:
          repository: ujnotes/web-site
          token: ${{ secrets.UJNOTES_PUBLISH_TOKEN }}
          submodules: recursive
          path: site/project

      - name: Check out public deployment repository
        uses: actions/checkout@v7
        with:
          repository: ujnotes/web-public
          token: ${{ secrets.UJNOTES_PUBLISH_TOKEN }}
          path: project/build

      - name: Check out Tiggu renderer
        uses: actions/checkout@v7
        with:
          repository: blank-org/tiggu
          ref: 5ec8d62c6cd04207bc99dacb0a3f79a677eb2805
          path: tiggu

      - name: Check out NCMS
        if: env.CONTENT_SOURCE == 'notion'
        uses: actions/checkout@v7
        with:
          repository: blank-org/ncms
          path: ncms

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install NCMS
        if: env.CONTENT_SOURCE == 'notion'
        run: python -m pip install --requirement ncms/requirements.txt

      - name: Render queued article with NCMS
        id: render
        if: env.CONTENT_SOURCE == 'notion'
        shell: bash
        env:
          REQUESTED_SLUG: ${{ github.event_name == 'workflow_dispatch' && inputs.slug || '' }}
          REQUESTED_STATUS: ${{ github.event_name == 'workflow_dispatch' && inputs.rerender_published && 'published' || 'publish' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          set -euo pipefail
          if [[ "$REQUESTED_STATUS" == "published" && -z "$REQUESTED_SLUG" ]]; then
            echo "rerender_published requires an explicit slug" >&2
            exit 1
          fi
          mkdir -p "$BUNDLE_DIR"
          args=(
            publish
            --status "$REQUESTED_STATUS"
            --bundle-dir "$BUNDLE_DIR"
            --metadata-file "$METADATA_FILE"
          )
          if [[ -n "$REQUESTED_SLUG" ]]; then
            args+=(--slug "$REQUESTED_SLUG")
          fi
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            args+=(--allow-empty)
          fi
          python ncms/ncms_fetch.py "${args[@]}"

          has_work=$(python -c 'import json,sys; print(str(not json.load(open(sys.argv[1], encoding="utf-8")).get("no_work", False)).lower())' "$METADATA_FILE")
          publish_changes=true
          if [[ "$DRY_RUN" == "true" ]]; then
            publish_changes=false
          fi
          echo "has_work=$has_work" >> "$GITHUB_OUTPUT"
          echo "publish_changes=$publish_changes" >> "$GITHUB_OUTPUT"

      - name: Prepare article metadata from GitHub
        id: render_github
        if: env.CONTENT_SOURCE == 'github'
        shell: bash
        env:
          REQUESTED_SLUG: ${{ inputs.slug }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$METADATA_FILE")"
          args=(
            prepare-github
            --metadata "$METADATA_FILE"
            --source site/project
            --base-url "$BASE_URL"
          )
          if [[ -n "${REQUESTED_SLUG:-}" ]]; then
            args+=(--slug "$REQUESTED_SLUG")
          fi
          python project/ci/publish_page.py "${args[@]}"
          publish_changes=true
          if [[ "$DRY_RUN" == "true" ]]; then
            publish_changes=false
          fi
          echo "has_work=true" >> "$GITHUB_OUTPUT"
          echo "publish_changes=$publish_changes" >> "$GITHUB_OUTPUT"

      - name: Resolve render outputs
        id: work
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CONTENT_SOURCE" == "github" ]]; then
            echo "has_work=${{ steps.render_github.outputs.has_work }}" >> "$GITHUB_OUTPUT"
            echo "publish_changes=${{ steps.render_github.outputs.publish_changes }}" >> "$GITHUB_OUTPUT"
          else
            echo "has_work=${{ steps.render.outputs.has_work }}" >> "$GITHUB_OUTPUT"
            echo "publish_changes=${{ steps.render.outputs.publish_changes }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare source and isolated build
        if: steps.work.outputs.has_work == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CONTENT_SOURCE" == "notion" ]]; then
            python project/ci/publish_page.py prepare-source \
              --bundle "$BUNDLE_DIR" \
              --metadata "$METADATA_FILE" \
              --source site/project \
              --base-url "$BASE_URL"
          fi
          python project/ci/publish_page.py create-stage \
            --metadata "$METADATA_FILE" \
            --source site/project \
            --stage "$STAGE_DIR"

          if [[ ! -e site/project/root ]]; then
            ln -s Root site/project/root
          fi
          if [[ ! -e "$STAGE_DIR/root" ]]; then
            ln -s Root "$STAGE_DIR/root"
          fi

      - name: Start Cutie renderer
        if: steps.work.outputs.has_work == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f project/compose-dev.yaml -p ujnotes-actions up -d --build web-site
          docker compose -f project/compose-dev.yaml -p ujnotes-actions exec -T web-site sh -lc '
            set -eu
            apt-get update
            apt-get install -y --no-install-recommends default-jre-headless minify wget
            rm -rf /var/lib/apt/lists/*
            mkdir -p /usr/local/lib/gclosure
            if [ ! -s /usr/local/lib/gclosure/closure-compiler.jar ]; then
              wget -q -O /usr/local/lib/gclosure/closure-compiler.jar \
                https://repo1.maven.org/maven2/com/google/javascript/closure-compiler/v20240317/closure-compiler-v20240317.jar
            fi
          '

      - name: Validate PHP and render article
        if: steps.work.outputs.has_work == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r component; do
            docker compose -f project/compose-dev.yaml -p ujnotes-actions exec -T web-site \
              php -l "/app/site/project/$component"
          done < <(python -c 'import json,sys; print("\n".join(json.load(open(sys.argv[1], encoding="utf-8"))["source_components"]))' "$METADATA_FILE")
          docker compose -f project/compose-dev.yaml -p ujnotes-actions exec -T web-site \
            /app/tiggu/build.sh /app/.ncms-publish/site

      - name: Validate and prepare public artifacts
        if: steps.work.outputs.has_work == 'true'
        run: |
          python project/ci/publish_page.py publish-artifacts \
            --metadata "$METADATA_FILE" \
            --stage "$STAGE_DIR" \
            --public-repo project/build \
            --base-url "$BASE_URL"
          python -m json.tool project/build/firebase.json >/dev/null
          python -c 'import xml.etree.ElementTree as ET; ET.parse("project/build/public/sitemap.xml")'
          mapfile -t sitemap_slug_args < <(python -c 'import json,sys; m=json.load(open(sys.argv[1], encoding="utf-8")); exit() if m.get("render_scope")=="all" else print("\n".join(m.get("queued_slugs") or [m["slug"]]))' "$METADATA_FILE")
          sitemap_args=()
          for slug in "${sitemap_slug_args[@]+"${sitemap_slug_args[@]}"}"; do
            sitemap_args+=(--slug "$slug")
          done
          python project/ci/validate_sitemap.py \
            --sitemap project/build/public/sitemap.xml \
            --translations site/project/Config/Translations.tsv \
            "${sitemap_args[@]}" \
            --public-root project/build/public \
            --firebase project/build/firebase.json \
            --base-url "$BASE_URL"
          git -C site/project diff --check
          git -C project/build diff --check

      - name: Upload dry-run artifacts
        if: steps.work.outputs.has_work == 'true' && steps.work.outputs.publish_changes != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: notion-article-dry-run
          path: |
            ${{ env.METADATA_FILE }}
            ${{ env.STAGE_DIR }}/public
          if-no-files-found: error
          retention-days: 7

      - name: Commit and push source
        if: env.CONTENT_SOURCE == 'notion' && steps.work.outputs.has_work == 'true' && steps.work.outputs.publish_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git -C site/project config user.name "ujnotes-publisher[bot]"
          git -C site/project config user.email "ujnotes-publisher[bot]@users.noreply.github.com"
          while IFS= read -r path; do
            git -C site/project add -- "$path"
          done < <(python -c 'import json,sys; print("\n".join(json.load(open(sys.argv[1], encoding="utf-8"))["source_paths"]))' "$METADATA_FILE")
          git -C site/project diff --cached --check
          if ! git -C site/project diff --cached --quiet; then
            slug=$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["slug"])' "$METADATA_FILE")
            git -C site/project commit -m "Publish $slug from Notion"
            git -C site/project push origin HEAD:main
          fi

      - name: Commit and push public site
        if: steps.work.outputs.has_work == 'true' && steps.work.outputs.publish_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git -C project/build config user.name "ujnotes-publisher[bot]"
          git -C project/build config user.email "ujnotes-publisher[bot]@users.noreply.github.com"
          while IFS= read -r path; do
            git -C project/build add -- "$path"
          done < <(python -c 'import json,sys; print("\n".join(json.load(open(sys.argv[1], encoding="utf-8"))["public_paths"]))' "$METADATA_FILE")
          git -C project/build diff --cached --check
          if ! git -C project/build diff --cached --quiet; then
            slug=$(python -c 'import json,sys; m=json.load(open(sys.argv[1], encoding="utf-8")); print("site" if m.get("render_scope")=="all" else m["slug"])' "$METADATA_FILE")
            source_label=$(python -c 'import json,sys; print({"github":"GitHub"}.get(json.load(open(sys.argv[1], encoding="utf-8")).get("content_source","notion"),"Notion"))' "$METADATA_FILE")
            git -C project/build commit -m "Publish $slug from $source_label"
            git -C project/build push origin HEAD:main
          fi

      - name: Verify live deployment
        if: steps.work.outputs.has_work == 'true' && steps.work.outputs.publish_changes == 'true'
        run: |
          python project/ci/publish_page.py verify-live \
            --metadata "$METADATA_FILE" \
            --base-url "$BASE_URL" \
            --timeout 600
          python project/ci/validate_sitemap.py \
            --sitemap project/build/public/sitemap.xml \
            --base-url "$BASE_URL" \
            --firebase project/build/firebase.json \
            --live

      - name: Mark Notion page published
        if: env.CONTENT_SOURCE == 'notion' && steps.work.outputs.has_work == 'true' && steps.work.outputs.publish_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          page_id=$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["page_id"])' "$METADATA_FILE")
          slug=$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["slug"])' "$METADATA_FILE")
          python ncms/ncms_fetch.py mark-published --page-id "$page_id" --expected-slug "$slug"

      - name: Stop renderer
        if: always() && steps.work.outputs.has_work == 'true'
        run: docker compose -f project/compose-dev.yaml -p ujnotes-actions down --remove-orphans
